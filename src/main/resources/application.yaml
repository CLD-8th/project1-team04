spring:
  application:
    name: usedTrade-app
  datasource:
    url: jdbc:mysql://localhost:3306/used_trade?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: used_trade
    password: used_trade_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  error:
    include-message: always

app:
  upload-dir: ./uploads

management:
  endpoints:
    web:
      exposure:
        include: health
