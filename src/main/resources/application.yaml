spring:
  application:
    name: usedTrade-app
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  error:
    include-message: always

app:
  upload-dir: ./uploads
  jwt:
    secret: ${JWT_SECRET}
    access-expire-minutes: 30
    refresh-expire-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health
