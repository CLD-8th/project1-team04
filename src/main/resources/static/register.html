<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중고거래 앱 - 상품 등록</title>
</head>
<body>
    <h1>새 상품 등록</h1>
    <a href="index.html">목록으로 돌아가기</a>
    <hr>
    <form id="register-form" enctype="multipart/form-data">
        <div>
            <label for="title">제목:</label><br>
            <input type="text" id="title" name="title" required>
        </div>
        <br>
        <div>
            <label for="content">내용:</label><br>
            <textarea id="content" name="content" required></textarea>
        </div>
        <br>
        <div>
            <label for="category">카테고리:</label><br>
            <input type="text" id="category" name="category" required>
        </div>
        <br>
        <div>
            <label for="price">가격 (원):</label><br>
            <input type="number" id="price" name="price" min="0" required>
        </div>
        <br>
        <div>
            <label for="image">이미지 파일:</label><br>
            <input type="file" id="image" name="image" accept="image/png, image/jpeg" required>
        </div>
        <br>
        <button type="submit">등록하기</button>
    </form>

    <div id="message"></div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function(event) {
            event.preventDefault(); // 기본 제출 동작 방지

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('content', document.getElementById('content').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('price', document.getElementById('price').value);

            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const response = await fetch('/api/products', {
                    method: 'POST',
                    body: formData // Content-Type은 브라우저가 자동으로 multipart/form-data로 설정함
                });

                if (response.status === 201) {
                    document.getElementById('message').innerText = '상품이 성공적으로 등록되었습니다!';
                    document.getElementById('register-form').reset();
                } else {
                    const errorText = await response.text();
                    document.getElementById('message').innerText = `오류: ${errorText}`;
                }
            } catch (error) {
                document.getElementById('message').innerText = `네트워크 오류: ${error.message}`;
            }
        });
    </script>
</body>
</html>
